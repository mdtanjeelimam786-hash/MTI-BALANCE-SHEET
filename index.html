ight:3px}.bar.dark{background:var(--blue)}.bar-label{position:absolute;bottom:-23px;font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;margin-top:33px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--blue)}.dot.light{background:#8db2ff}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:22px;padding:12px 0}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--blue) 0 56%,#6ebfa6 56% 77%,#f2bd5d 77% 100%);display:grid;place-items:center;flex-shrink:0}.donut-hole{width:92px;height:92px;border-radius:50%;background:white;display:grid;place-items:center;text-align:center;font-weight:800;font-size:19px}.donut-hole small{font-size:10px;font-weight:500;color:var(--muted)}.legend-list{display:grid;gap:13px;font-size:12px}.legend-row{display:flex;justify-content:space-between;gap:14px}.legend-name{color:var(--muted)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:800;background:#fafbfd}td,th{padding:13px 12px;border-bottom:1px solid #edf0f5}tbody tr:last-child td{border-bottom:0}.amount{text-align:right;font-variant-numeric:tabular-nums}.tag{display:inline-flex;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#e8f7f0;color:#147c56}.tag.expense{background:#fff0f0;color:#bc4141}.tag.neutral{background:#edf2fa;color:#526783}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;font-weight:800;color:#52627b}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7da4ff;box-shadow:0 0 0 3px #2463eb18}.search{min-width:220px;flex:1}.filter{min-width:150px}.page-title{margin:0 0 5px;font-size:24px;letter-spacing:-.5px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.section-title{font-size:13px;font-weight:800;background:#f4f7fc;padding:12px;border-radius:7px;margin:16px 0 8px}.statement-row{display:flex;justify-content:space-between;gap:15px;padding:10px 12px;border-bottom:1px solid #edf0f5;font-size:12px}.statement-row.indent{padding-left:28px;color:#53647d}.statement-row.total{font-weight:800;background:#f6f9ff}.statement-row.grand{font-size:14px;background:#eaf1ff;font-weight:900}.balance-status{padding:13px 15px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;margin-bottom:18px}.balance-status.ok{background:#e7f8f0;color:#08764d}.balance-status.bad{background:#fff0e0;color:#a35a00}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .full{grid-column:1/-1}.empty{text-align:center;padding:34px;color:var(--muted);font-size:12px}.muted{color:var(--muted)}.report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.report-card{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:flex-start}.report-icon{height:42px;width:42px;background:var(--blue2);color:var(--blue);border-radius:11px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.report-card h3{font-size:13px;margin:2px 0 6px}.report-card p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 12px}.settings-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{background:#fff8e6;border:1px solid #f1dfad;border-radius:10px;padding:13px;color:#795a12;font-size:12px;line-height:1.6;margin-bottom:18px}.mobile-menu{display:none}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#10233b88;display:grid;place-items:center;padding:16px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:24px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f0f3f8;border-radius:8px;padding:7px 10px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:20px;right:20px;background:#16375f;color:white;border-radius:10px;padding:13px 18px;font-size:12px;box-shadow:0 8px 30px #0002;z-index:50;max-width:90vw}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102b52,#2463eb)}.login-card{background:white;border-radius:18px;padding:32px;width:min(430px,100%);box-shadow:0 20px 60px #00102e55}.login-card h1{font-size:25px;margin:15px 0 8px}.login-card .field{margin-top:15px}.login-card .btn{width:100%;margin-top:18px}.login-card .sub{margin-bottom:18px}.login-foot{text-align:center;font-size:11px;color:var(--muted);margin-top:17px}
@media(max-width:1000px){.sidebar{width:220px}.main{margin-left:220px}.content{padding:24px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:250px;box-shadow:10px 0 30px #0002}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:inline-grid;place-items:center;border:0;background:#eef3ff;border-radius:9px;width:36px;height:36px;color:var(--blue);margin-right:10px}.topbar{height:64px;padding:0 14px}.crumb strong{font-size:15px}.demo-pill{display:none}.content{padding:20px 13px 35px}.welcome{display:block}.welcome .actions{margin-top:16px}.welcome h1{font-size:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.stat-value{font-size:20px}.stat-top{font-size:11px}.stat-icon{width:29px;height:29px}.panel{padding:15px}.report-grid,.settings-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.page-head{display:block}.page-head .actions{margin-top:13px}.toolbar .field{flex:1}.search{min-width:100%}.donut-wrap{flex-wrap:wrap}.table-wrap table{min-width:620px}.top-actions{gap:8px}}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const dateFmt = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
const defaultAccounts = [
{id:'cash',code:'1000',name:'Cash and Bank',type:'asset',subtype:'current_asset',opening:125000},
{id:'ar',code:'1100',name:'Accounts Receivable',type:'asset',subtype:'current_asset',opening:45000},
{id:'inventory',code:'1200',name:'Inventory',type:'asset',subtype:'current_asset',opening:32000},
{id:'equipment',code:'1500',name:'Equipment',type:'asset',subtype:'fixed_asset',opening:180000},
{id:'ap',code:'2000',name:'Accounts Payable',type:'liability',subtype:'current_liability',opening:38000},
{id:'loan',code:'2500',name:'Business Loan',type:'liability',subtype:'long_term_liability',opening:90000},
{id:'capital',code:'3000',name:'Owner Capital',type:'equity',subtype:'capital',opening:220000},
{id:'retained',code:'3100',name:'Retained Earnings',type:'equity',subtype:'retained',opening:0},
{id:'sales',code:'4000',name:'Sales Revenue',type:'income',subtype:'operating_income',opening:0},
{id:'service',code:'4100',name:'Service Income',type:'income',subtype:'other_income',opening:0},
{id:'rent',code:'5000',name:'Rent Expense',type:'expense',subtype:'operating_expense',opening:0},
{id:'utilities',code:'5100',name:'Utilities Expense',type:'expense',subtype:'operating_expense',opening:0},
{id:'supplies',code:'5200',name:'Office Supplies',type:'expense',subtype:'operating_expense',opening:0}
];
const seed = {
company:{name:'Northstar Trading Co.',fy:'2026-2027',currency:'INR',email:'accounts@example.com',address:'Dhanbad, Jharkhand, India'},
accounts:defaultAccounts,
entries:[
{id:'t1',date:'2026-04-02',description:'Owner investment',reference:'JV-001',lines:[{accountId:'cash',debit:100000,credit:0},{accountId:'capital',debit:0,credit:100000}]},
{id:'t2',date:'2026-04-04',description:'Office equipment purchased',reference:'PV-001',lines:[{accountId:'equipment',debit:45000,credit:0},{accountId:'cash',debit:0,credit:45000}]},
{id:'t3',date:'2026-04-08',description:'Product sales',reference:'RV-001',lines:[{accountId:'cash',debit:38000,credit:0},{accountId:'sales',debit:0,credit:38000}]},
{id:'t4',date:'2026-04-10',description:'Office rent paid',reference:'PV-002',lines:[{accountId:'rent',debit:12000,credit:0},{accountId:'cash',debit:0,credit:12000}]},
{id:'t5',date:'2026-04-14',description:'Service revenue received',reference:'RV-002',lines:[{accountId:'cash',debit:18000,credit:0},{accountId:'service',debit:0,credit:18000}]},
{id:'t6',date:'2026-04-18',description:'Office supplies',reference:'PV-003',lines:[{accountId:'supplies',debit:3500,credit:0},{accountId:'cash',debit:0,credit:3500}]},
{id:'t7',date:'2026-04-22',description:'Utilities paid',reference:'PV-004',lines:[{accountId:'utilities',debit:2200,credit:0},{accountId:'cash',debit:0,credit:2200}]}
],
loggedIn:false
};
let state = loadState(), page='dashboard', transactionSearch='', transactionType='all', reportPeriod='fy', editingId=null, toastTimer;
function loadState(){try{const s=localStorage.getItem('ledgerpro_demo_v1');if(s)return JSON.parse(s)}catch(e){}return structuredClone(seed)}
function saveState(){try{localStorage.setItem('ledgerpro_demo_v1',JSON.stringify(state))}catch(e){}}
function account(id){return state.accounts.find(a=>a.id===id)}
function normalSide(type){return ['asset','expense'].includes(type)?'debit':'credit'}
function accountBalance(a, endDate='9999-12-31', startDate='0000-01-01'){
 let bal=Number(a.opening)||0;
 for(const e of state.entries){if(e.date>endDate||e.date<startDate)continue;for(const l of e.lines){if(l.accountId!==a.id)continue;bal+=normalSide(a.type)==='debit'?(Number(l.debit)-Number(l.credit)):(Number(l.credit)-Number(l.debit));}}
 return bal;
}
function totals(end='9999-12-31',start='0000-01-01'){
 const byType={asset:0,liability:0,equity:0,income:0,expense:0};
 state.accounts.forEach(a=>{const b=accountBalance(a,end,start);byType[a.type]=(byType[a.type]||0)+b});
 // Balance sheet equity includes net income to date; report period determines income statement.
 const periodIncome=state.accounts.filter(a=>a.type==='income').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const periodExpense=state.accounts.filter(a=>a.type==='expense').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const net=periodIncome-periodExpense;
 return {...byType,net,assets:byType.asset,liabilities:byType.liability,equity:byType.equity+net,accountingDiff:byType.asset-byType.liability-byType.equity-net};
}
function fiscalDates(){const fy=state.company.fy||'2026-2027';const y=Number(fy.slice(0,4));return {start:`${y}-04-01`,end:`${y+1}-03-31`}}
function periodBounds(){if(reportPeriod==='all')return {start:'0000-01-01',end:'9999-12-31'};return fiscalDates()}
function fmtType(t){return ({asset:'Asset',liability:'Liability',equity:'Equity',income:'Income',expense:'Expense'})[t]||t}
function toast(msg){const root=$('#toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',2600)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navItem(id,icon,label){return `<button class="nav-btn ${page===id?'active':''}" data-page="${id}"><span class="ico">${icon}</span>${label}</button>`}
function shell(content,title){
 $('#app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">L</div>LedgerPro</div><div class="nav-label">Workspace</div>${navItem('dashboard','▦','Dashboard')}${navItem('balance','▤','Balance Sheet')}${navItem('transactions','⇄','Transactions')}${navItem('accounts','◫','Chart of Accounts')}<div class="nav-label">Analysis</div>${navItem('reports','▥','Financial Reports')}${navItem('company','▣','Company Profile')}${navItem('settings','⚙','Settings')}<div class="sidebar-foot">LedgerPro Finance<br><span>DEMO MODE · Local browser storage</span></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center"><button class="mobile-menu" id="mobile-menu">☰</button><div class="crumb">Workspace <strong>${title}</strong></div></div><div class="top-actions"><span class="demo-pill">DEMO DATA</span><div class="avatar">LP</div></div></header><div class="content">${content}</div></main></div>`;
 document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
 $('#mobile-menu').onclick=()=>$('#sidebar').classList.toggle('open');
}
function pageHead(title,sub,buttons=''){return `<div class="page-head"><div><h1 class="page-title">${title}</h1><div class="sub">${sub}</div></div><div class="actions">${buttons}</div></div>`}
function stat(title,value,icon,note,cls=''){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon">${icon}</span></div><div class="stat-value ${cls}">${money(value)}</div><div class="stat-note">${note}</div></div>`}
function transactionRows(entries){if(!entries.length)return `<tr><td colspan="6" class="empty">No transactions found.</td></tr>`;return entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{const amount=e.lines.reduce((s,l)=>s+Number(l.debit||0),0);const type=e.lines.map(l=>account(l.accountId)?.type).find(t=>['income','expense'].includes(t))||'neutral';return `<tr><td>${dateFmt(e.date)}</td><td><strong>${esc(e.description)}</strong><div class="muted" style="font-size:10px;margin-top:3px">${esc(e.reference||'—')}</div></td><td>${esc(e.lines.map(l=>account(l.accountId)?.name||'Unknown').join(', '))}</td><td><span class="tag ${type==='expense'?'expense':type==='neutral'?'neutral':''}">${type==='neutral'?'Journal':fmtType(type)}</span></td><td class="amount">${money(amount)}</td><td><button class="btn" data-edit-tx="${e.id}">Edit</button> <button class="btn danger" data-delete-tx="${e.id}">Delete</button></td></tr>`}).join('')}
function wireTxRows(){document.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>openTransaction(b.dataset.editTx));document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>deleteTransaction(b.dataset.deleteTx))}
function dashboard(){
 const t=totals(), {start,end}=fiscalDates();
 const entries=state.entries.filter(e=>e.date>=start&&e.date<=end);
 const income=state.accounts.filter(a=>a.type==='income').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const expenses=state.accounts.filter(a=>a.type==='expense').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const net=income-expenses;
 const months=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
 const vals=months.map((m,i)=>{const y=Number(start.slice(0,4))+(i>=9?1:0), mo=String((i+3)%12+1).padStart(2,'0'), begin=`${y}-${mo}-01`;const nextMonth=(i+4)%12+1;const ny=y+(i===8?1:i===11?1:0);let finish;if(i===11)finish=`${y}-03-31`;else{const dt=new Date(y,Number(mo),0);finish=`${y}-${mo}-${String(dt.getDate()).padStart(2,'0')}`}return {m,inc:state.accounts.filter(a=>a.type==='income').reduce((s,a)=>s+accountBalance(a,finish,begin),0),exp:state.accounts.filter(a=>a.type==='expense').reduce((s,a)=>s+accountBalance(a,finish,begin),0)}});
 const max=Math.max(1,...vals.flatMap(v=>[v.inc,v.exp]));
 const bars=vals.map(v=>`<div class="bar-group"><div class="bar dark" style="height:${Math.max(2,v.inc/max*100)}%"></div><div class="bar" style="height:${Math.max(2,v.exp/max*100)}%"></div><span class="bar-label">${v.m}</span></div>`).join('');
 const t2=totals(end,start);
 return `<div class="welcome"><div><div class="eyebrow">Financial overview · ${esc(state.company.fy)}</div><h1>Good evening 👋</h1><div class="sub">Here is the financial snapshot for ${esc(state.company.name)}.</div></div><div class="actions"><button class="btn" id="export-csv">↓ Export CSV</button><button class="btn primary" id="new-tx">＋ New transaction</button></div></div>
 <div class="notice"><strong>Prototype notice:</strong> This is a functional demo using sample data stored in this browser only. It is not secure accounting software; do not enter confidential or statutory financial data.</div>
 <div class="grid stats">${stat('Total Assets',t2.assets,'▣','Current and fixed assets')}${stat('Total Liabilities',t2.liabilities,'↗','Current and long-term')}${stat("Owner's Equity",t2.equity,'◈','Capital plus retained earnings and profit')}${stat('Total Income',income,'↘','Selected financial year','positive')}${stat('Total Expenses',expenses,'↗','Selected financial year','')}${stat('Net Profit / Loss',net,'◎',net>=0?'Income exceeds expenses':'Expenses exceed income',net>=0?'positive':'negative')}</div>

function balanceSheet(){
 const {start,end}=periodBounds(),t=totals(end,start);
 const groups=[['Current Assets',a=>a.type==='asset'&&a.subtype==='current_asset'],['Fixed Assets',a=>a.type==='asset'&&a.subtype==='fixed_asset'],['Current Liabilities',a=>a.type==='liability'&&a.subtype==='current_liability'],['Long-term Liabilities',a=>a.type==='liability'&&a.subtype==='long_term_liability'],["Owner's Capital",a=>a.type==='equity'&&a.subtype==='capital'],['Retained Earnings',a=>a.type==='equity'&&a.subtype==='retained']];
 function groupRows(title,pred){const rows=state.accounts.filter(pred);return `<div class="section-title">${title}</div>${rows.map(a=>`<div class="statement-row indent"><span>${esc(a.name)}</span><span>${money(accountBalance(a,end,start))}</span></div>`).join('')||'<div class="statement-row indent muted">No accounts in this category</div>'}`}
 const assets=state.accounts.filter(a=>a.type==='asset').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const liabs=state.accounts.filter(a=>a.type==='liability').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const capital=state.accounts.filter(a=>a.type==='equity').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const inc=state.accounts.filter(a=>a.type==='income').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const exp=state.accounts.filter(a=>a.type==='expense').reduce((s,a)=>s+accountBalance(a,end,start),0);
 const equity=capital+inc-exp, diff=assets-liabs-equity;
 const status=Math.abs(diff)<.005;
 return `${pageHead('Balance Sheet','A point-in-time view of assets, liabilities and equity.',`<button class="btn" id="print-report">⎙ Print</button><button class="btn primary" id="export-balance">↓ Export CSV</button>`)}
 <div class="balance-status ${status?'ok':'bad'}">${status?'✓':'⚠'} ${status?'Balanced — Assets equal Liabilities + Equity.':'Out of balance by '+money(Math.abs(diff))+'. Review opening balances and journal entries.'}</div>
 <section class="panel" id="print-area"><div style="text-align:center;padding:10px 0 20px"><h2 style="font-size:20px;margin:0 0 7px">${esc(state.company.name)}</h2><div class="sub">BALANCE SHEET</div><div class="sub">As at ${dateFmt(end==='9999-12-31'?today():end)}</div><div class="sub">${esc(state.company.currency)}</div></div>
 ${groupRows('ASSETS — Current Assets',a=>a.type==='asset'&&a.subtype==='current_asset')}${groupRows('ASSETS — Fixed Assets',a=>a.type==='asset'&&a.subtype==='fixed_asset')}<div class="statement-row total"><span>Total Assets</span><span>${money(assets)}</span></div>
 ${groupRows('LIABILITIES — Current Liabilities',a=>a.type==='liability'&&a.subtype==='current_liability')}${groupRows('LIABILITIES — Long-term Liabilities',a=>a.type==='liability'&&a.subtype==='long_term_liability')}<div class="statement-row total"><span>Total Liabilities</span><span>${money(liabs)}</span></div>
 ${groupRows("EQUITY — Owner's Capital",a=>a.type==='equity'&&a.subtype==='capital')}${groupRows('EQUITY — Retained Earnings',a=>a.type==='equity'&&a.subtype==='retained')}<div class="statement-row"><span class="muted">Current period earnings (income less expenses)</span><span>${money(inc-exp)}</span></div><div class="statement-row grand"><span>Total Liabilities and Equity</span><span>${money(liabs+equity-liabs)}</span></div><div class="statement-row total"><span>Balance difference</span><span class="${status?'positive':'negative'}">${money(diff)}</span></div></section>`;
}

 modal(a?'Edit account':'Add account',`<form id="account-form"><div class="form-grid"><div class="field"><label>Account code *</label><input name="code" required value="${esc(a?.code||'')}" placeholder="e.g. 1050"></div><div class="field"><label>Account name *</label><input name="name" required value="${esc(a?.name||'')}" placeholder="e.g. Petty Cash"></div><div class="field"><label>Account type *</label><select name="type" id="account-type">${['asset','liability','equity','income','expense'].map(t=>`<option value="${t}" ${a?.type===t?'selected':''}>${fmtType(t)}</option>`).join('')}</select></div><div class="field"><label>Subcategory *</label><select name="subtype" id="account-subtype"></select></div><div class="field full"><label>Opening balance (normal balance, ₹)</label><input name="opening" type="number" step=".01" min="0" value="${a?.opening||0}"></div></div><div class="notice" style="margin-top:14px;margin-bottom:0">Opening balances should be entered on the account's normal side. To maintain a balanced ledger, opening balances across all accounts must reconcile.</div><div class="form-actions"><button type="button" class="btn" id="cancel-account">Cancel</button><button class="btn primary">Save account</button></div></form>`);
 const setSubs=()=>{const type=$('#account-type').value;$('#account-subtype').innerHTML=subs[type].map(([v,l])=>`<option value="${v}" ${(a?.subtype===v)||(!a&&subs[type][0][0]===v)?'selected':''}>${l}</option>`).join('')};$('#account-type').onchange=setSubs;setSubs();$('#cancel-account').onclick=closeModal;
 $('#account-form').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),obj={id:id||uid(),code:f.get('code').trim(),name:f.get('name').trim(),type:f.get('type'),subtype:f.get('subtype'),opening:Number(f.get('opening'))||0};if(state.accounts.some(x=>x.code===obj.code&&x.id!==id)){toast('Account code must be unique.');return}if(id){const old=account(id);if(state.entries.some(e=>e.lines.some(l=>l.accountId===id))&&old.type!==obj.type){toast('Cannot change account type after journal activity exists.');return}state.accounts=state.accounts.map(x=>x.id===id?obj:x)}else state.accounts.push(obj);saveState();closeModal();render();toast('Account saved.')};
}
function deleteAccount(id){const a=account(id);if(!a)return;if(state.entries.some(e=>e.lines.some(l=>l.accountId===id))){toast('Cannot delete an account used by a journal entry.');return}if(confirm(`Delete account "${a.name}"?`)){state.accounts=state.accounts.filter(x=>x.id!==id);saveState();render();toast('Account deleted.')}}
function exportCSV(filename,rows){const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(filename,'\ufeff'+csv,'text/csv;charset=utf-8')}
function download(filename,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function exportTransactions(){exportCSV('ledgerpro-transactions.csv',[['Date','Reference','Description','Account Code','Account','Debit','Credit'],...state.entries.flatMap(e=>e.lines.map(l=>[e.date,e.reference,e.description,account(l.accountId)?.code,account(l.accountId)?.name,l.debit,l.credit]))]);toast('Transaction CSV exported.')}
function exportAccounts(){exportCSV('ledgerpro-accounts.csv',[['Code','Account','Type','Subcategory','Opening Balance','Current Balance'],...state.accounts.map(a=>[a.code,a.name,a.type,a.subtype,a.opening,accountBalance(a)])]);toast('Accounts CSV exported.')}
function exportReport(which){if(which==='balance'){const rows=[['Company',state.company.name],['Report','Balance Sheet'],['Financial year',state.company.fy],[],['Account','Type','Balance'],...state.accounts.filter(a=>['asset','liability','equity'].includes(a.type)).map(a=>[a.name,a.type,accountBalance(a)])];exportCSV('balance-sheet.csv',rows)}else{exportCSV('financial-report.csv',[['Account code','Account','Type','Debit balance','Credit balance'],...state.accounts.map(a=>{const b=accountBalance(a);return [a.code,a.name,a.type,normalSide(a.type)==='debit'?b:0,normalSide(a.type)==='credit'?b:0]})])}toast('Report CSV exported.')}
function showReport(kind){
 const root=$('#report-detail');if(!root)return;const {start,end}=periodBounds();let title='',rows=[],totalLabel='',total=0;
 if(kind==='balance'){title='Balance Sheet';rows=state.accounts.filter(a=>['asset','liability','equity'].includes(a.type)).map(a=>[a.name,fmtType(a.type),accountBalance(a,end,start)]);totalLabel='Assets';total=state.accounts.filter(a=>a.type==='asset').reduce((s,a)=>s+accountBalance(a,end,start),0)}
 if(kind==='pnl'){title='Profit & Loss Statement';rows=state.accounts.filter(a=>['income','expense'].includes(a.type)).map(a=>[a.name,fmtType(a.type),accountBalance(a,end,start)]);const i=rows.filter(r=>r[1]==='Income').reduce((s,r)=>s+r[2],0),x=rows.filter(r=>r[1]==='Expense').reduce((s,r)=>s+r[2],0);totalLabel='Net profit / loss';total=i-x}
 if(kind==='trial'){title='Trial Balance';rows=state.accounts.map(a=>[a.name,normalSide(a.type)==='debit'?accountBalance(a,end,start):0,normalSide(a.type)==='credit'?accountBalance(a,end,start):0]);totalLabel='';}
 if(kind==='ledger'){title='General Ledger';rows=state.accounts.map(a=>[a.code+' — '+a.name,accountBalance(a,end,start),a.type]);totalLabel='Accounts';total=rows.length}
 if(kind==='cashflow'){title='Cash Flow Summary';const cash=state.accounts.filter(a=>a.type==='asset'&&/cash|bank/i.test(a.name));rows=cash.map(a=>[a.name,accountBalance(a,end,start),'Ending balance']);totalLabel='Cash and bank total';total=cash.reduce((s,a)=>s+accountBalance(a,end,start),0)}
 const headers=kind==='trial'?['Account','Debit','Credit']:kind==='ledger'?['Account','Balance','Type']:['Account','Category','Amount / balance'];
 root.innerHTML=`<section class="panel"><div class="panel-head"><div><h2>${title}</h2><div class="panel-desc">${dateFmt(start)} – ${end==='9999-12-31'?'All dates':dateFmt(end)}</div></div><button class="btn" id="detail-csv">Export this report</button></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i>0?'amount':''}">${typeof v==='number'?money(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${totalLabel?`<div class="statement-row grand"><span>${totalLabel}</span><span>${kind==='ledger'?total:money(total)}</span></div>`:''}${kind==='trial'?`<div class="balance-status ${Math.abs(rows.reduce((s,r)=>s+r[1],0)-rows.reduce((s,r)=>s+r[2],0))<.005?'ok':'bad'}">Trial balance difference: ${money(rows.reduce((s,r)=>s+r[1],0)-rows.reduce((s,r)=>s+r[2],0))}. Note: opening balances must be entered on normal sides and must reconcile.</div>`:''}</section>`;
 $('#detail-csv').onclick=()=>exportCSV(title.toLowerCase().replaceAll(' ','-')+'.csv',[headers,...rows]);root.scrollIntoView({behavior:'smooth',block:'start'});
}
render();
</script>
</body>
</html>
